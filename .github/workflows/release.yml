name: Release

# Manual only, and deliberately so: nothing in this repository can reach npm on
# its own. Not a push, not a merge, not a tag. Publishing happens when a person
# opens Actions -> Release -> Run workflow and says so.
#
# `dry-run` defaults to TRUE, so the dangerous choice is never the default one:
# running this workflow without thinking packs every package, proves the token
# and the org, and uploads nothing. Untick it only when you mean it.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Resolve and pack every package, but do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The tag does not get to assert that the tree is green — CI does, again, on
  # the exact commit being published. This duplicates `ci.yml` on purpose: a
  # release must never depend on a status check someone could have re-run.
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose: the action reads `packageManager` from
      # package.json, and specifying both is a hard error in v4.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      # Required for npm provenance: the OIDC token is what lets npm attest that
      # this tarball was built by this workflow, from this commit, in public CI.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose: the action reads `packageManager` from
      # package.json, and specifying both is a hard error in v4.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # There is no tag to check against any more, so the manifest is the source
      # of truth and the job's own output is the record of what it shipped. A
      # version already on npm cannot be republished — npm refuses, permanently
      # — so catching it here turns an unrecoverable half-publish into a clean
      # failure before the first tarball moves.
      - name: Report the version, and refuse one already published
        run: |
          pkg="$(node -p "require('./packages/cli/package.json').version")"
          echo "arcturn version in the manifest: $pkg"
          echo "dry-run: ${{ inputs.dry-run }}"
          if [ "${{ inputs.dry-run }}" = "false" ]; then
            if npm view "arcturn@$pkg" version >/dev/null 2>&1; then
              echo "::error::arcturn@$pkg is already on npm — bump the version before publishing"
              exit 1
            fi
            echo "arcturn@$pkg is not on the registry; publishing"
          fi

      # `pnpm publish -r` walks the workspace in dependency order and rewrites
      # every `workspace:*` range to the real version as it goes, so the
      # published `arcturn` never points at a spec npm cannot resolve.
      #
      # Gated on the INPUT, not on the event: this workflow has exactly one
      # trigger now, so keying off `github.event_name` would make the publish
      # step unreachable and every run a silent dry run.
      - name: Publish to npm
        if: ${{ inputs.dry-run == false }}
        run: pnpm publish -r --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run (pack only)
        if: ${{ inputs.dry-run }}
        run: pnpm publish -r --access public --no-git-checks --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
