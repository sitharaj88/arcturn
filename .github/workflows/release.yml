name: Release

# Publishing is deliberately tag-triggered, never push-triggered: a merge to
# `main` must not be able to reach npm on its own. Tag `v0.1.0` to ship 0.1.0.
on:
  push:
    tags: ["v*"]
  # A dry run publishes nothing and exists so the release path can be exercised
  # before it matters, rather than debugged for the first time under a tag.
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Resolve and pack every package, but do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The tag does not get to assert that the tree is green — CI does, again, on
  # the exact commit being published. This duplicates `ci.yml` on purpose: a
  # release must never depend on a status check someone could have re-run.
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      # Required for npm provenance: the OIDC token is what lets npm attest that
      # this tarball was built by this workflow, from this commit, in public CI.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The tag is the source of truth for the version. A tag that disagrees
      # with the manifests is a mistake worth failing on, not reconciling
      # silently — publishing 0.1.0 from a `v0.2.0` tag is unrecoverable.
      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match packages/cli version $pkg"
            exit 1
          fi
          echo "publishing $pkg"

      # `pnpm publish -r` walks the workspace in dependency order and rewrites
      # every `workspace:*` range to the real version as it goes, so the
      # published `arcturn` never points at a spec npm cannot resolve.
      - name: Publish to npm
        if: ${{ github.event_name == 'push' }}
        run: pnpm publish -r --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run (pack only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: pnpm publish -r --access public --no-git-checks --dry-run
