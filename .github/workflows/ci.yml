name: CI

# Manual only. Nothing in this repository runs CI on its own — a push or a pull
# request will not start it, so the matrix runs when a person asks for it and
# not before. Run it from Actions -> CI -> Run workflow.
on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows failures must not be masked by a green macOS/Linux job, and a
      # red Windows job must not cancel macOS/Linux jobs still in flight.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose: the action reads `packageManager` from
      # package.json, and specifying both is a hard error in v4.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
