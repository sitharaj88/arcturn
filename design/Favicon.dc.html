<!doctype html>
<html>

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; }
    a { color: #f2af48; } a:hover { color: #fad185; }
  </style>
</helmet>
<div style="width: 740px; height: 360px; background: #13100c; display: flex; flex-direction: column; padding: 32px 36px; box-sizing: border-box; gap: 24px;">
  <div style="display: flex; align-items: flex-end; gap: 44px;">
    <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
        <defs>
          <linearGradient id="rampF1" x1="16" y1="50" x2="48" y2="14" gradientUnits="userSpaceOnUse">
            <stop stop-color="#b87436"/>
            <stop offset="1" stop-color="#f2af48"/>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="14" fill="#0c0a07"/>
        <g transform="translate(32,33.5)">
          <path d="M 19.7 -3.5 A 20 20 0 1 1 3.5 -19.7" stroke="url(#rampF1)" stroke-width="5.2" stroke-linecap="round"/>
          <path transform="translate(14.1,-14.1) scale(0.22)" d="M0 -40C3 -11 11 -3 40 0C11 3 3 11 0 40C-3 11 -11 3 -40 0C-11 -3 -3 -11 0 -40Z" fill="url(#rampF1)"/>
        </g>
      </svg>
      <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; color: #6d675f;">64</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
      <svg width="32" height="32" viewBox="0 0 64 64" fill="none">
        <defs>
          <linearGradient id="rampF2" x1="16" y1="50" x2="48" y2="14" gradientUnits="userSpaceOnUse">
            <stop stop-color="#b87436"/>
            <stop offset="1" stop-color="#f2af48"/>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="14" fill="#0c0a07"/>
        <g transform="translate(32,33.5)">
          <path d="M 19.7 -3.5 A 20 20 0 1 1 3.5 -19.7" stroke="url(#rampF2)" stroke-width="6.5" stroke-linecap="round"/>
          <path transform="translate(14.1,-14.1) scale(0.26)" d="M0 -40C3 -11 11 -3 40 0C11 3 3 11 0 40C-3 11 -11 3 -40 0C-11 -3 -3 -11 0 -40Z" fill="url(#rampF2)"/>
        </g>
      </svg>
      <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; color: #6d675f;">32</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
      <svg width="16" height="16" viewBox="0 0 64 64" fill="none">
        <defs>
          <linearGradient id="rampF3" x1="16" y1="50" x2="48" y2="14" gradientUnits="userSpaceOnUse">
            <stop stop-color="#b87436"/>
            <stop offset="1" stop-color="#f2af48"/>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="16" fill="#0c0a07"/>
        <path transform="translate(32,32) scale(0.62)" d="M0 -40C3 -11 11 -3 40 0C11 3 3 11 0 40C-3 11 -11 3 -40 0C-11 -3 -3 -11 0 -40Z" fill="url(#rampF3)"/>
      </svg>
      <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; color: #6d675f;">16</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; background: #26201a; border-radius: 8px 8px 0 0; padding: 8px 14px; margin-left: 12px;">
      <svg width="16" height="16" viewBox="0 0 64 64" fill="none">
        <defs>
          <linearGradient id="rampF4" x1="16" y1="50" x2="48" y2="14" gradientUnits="userSpaceOnUse">
            <stop stop-color="#b87436"/>
            <stop offset="1" stop-color="#f2af48"/>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="16" fill="#0c0a07"/>
        <path transform="translate(32,32) scale(0.62)" d="M0 -40C3 -11 11 -3 40 0C11 3 3 11 0 40C-3 11 -11 3 -40 0C-11 -3 -3 -11 0 -40Z" fill="url(#rampF4)"/>
      </svg>
      <span style="font-size: 11px; color: #96918a;">arcturn — every turn counts</span>
      <span style="font-size: 11px; color: #6d675f; margin-left: 6px;">×</span>
    </div>
  </div>
  <div style="border-top: 1px solid #26201a; padding-top: 18px; display: flex; flex-direction: column; gap: 6px;">
    <div style="font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace; font-weight: 600; font-size: 13px; color: #e8e3da; letter-spacing: 0.04em;">Favicon fidelity</div>
    <div style="font-size: 12px; line-height: 1.5; color: #96918a;">The full mark holds to 32px. At 16px the arc collapses into noise, so the favicon simplifies to the star alone — the one-glyph signature (✦) the CLI status bar already uses.</div>
  </div>
</div>
</x-dc>
